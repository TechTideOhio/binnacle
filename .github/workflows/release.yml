name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build & Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: binnacle
            asset_name: binnacle-linux-x86_64.tar.gz
          - os: windows-latest
            artifact_name: binnacle.exe
            asset_name: binnacle-windows-x86_64.zip
          - os: macos-latest
            artifact_name: binnacle
            asset_name: binnacle-macos-x86_64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Build Release
        run: cargo build --release

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.asset_name }} -C target/release ${{ matrix.artifact_name }}

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/release/${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          files: ${{ matrix.asset_name }}
